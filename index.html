<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>토끼 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen 3D meadow, HUD floats on top — chat at top, joystick bottom-left, actions bottom-right */
:root {
  --sky: #bfe3f2;
  --ink: #2d3a2e;
  --panel: rgba(255, 252, 244, 0.93);
  --line: #e4dcc6;
  --carrot: #f28c38;
  --leaf: #5f9e4b;
  --pink: #f4a7b9;
  --type: #6fbf4a;
  --font-display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--sky); color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* name tags + speech bubbles */
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.tag { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; will-change: transform; }
.tag .name { font-family: var(--font-display); font-size: 13px; color: #fff; background: rgba(45, 58, 46, 0.62); padding: 2px 9px; border-radius: 9px; white-space: nowrap; }
.tag.me .name { background: var(--carrot); }
.tag.friend .name { background: #3f7fc4; box-shadow: 0 0 0 2px #9fe0ae; }
.bubble { position: relative; max-width: 190px; background: #fff; color: var(--ink); padding: 6px 11px; border-radius: 14px; font-size: 14px; line-height: 1.35; text-align: center; word-break: keep-all; overflow-wrap: anywhere; box-shadow: 0 2px 0 rgba(45, 58, 46, 0.18); animation: pop .22s ease-out; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
.bubble.emote { font-size: 22px; padding: 2px 10px; }
.float { position: absolute; top: -10px; font-size: 22px; animation: rise 1.3s ease-out forwards; }
@keyframes rise { from { transform: translate(var(--dx, 0), 0) scale(.6); opacity: 1; } to { transform: translate(var(--dx, 0), -70px) scale(1.2); opacity: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* HUD */
.hud { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.hud-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.hud-right { display: flex; gap: 6px; align-items: center; }
.pill { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: var(--panel); color: var(--ink); border: none; border-radius: 999px; padding: 6px 13px; font-family: var(--font-display); font-size: 17px; line-height: 1.2; box-shadow: 0 2px 0 rgba(45, 58, 46, 0.15); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill small { font-family: var(--font-body); font-size: 12px; opacity: .7; }
button.pill { cursor: pointer; touch-action: manipulation; }
button.pill:active { transform: translateY(2px); box-shadow: none; }
#editBtn { padding: 6px 10px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #4cc26a; box-shadow: 0 0 0 3px rgba(76, 194, 106, .25); }
.dot.off { background: #a5a59a; box-shadow: 0 0 0 3px rgba(165, 165, 154, .25); }
#carrots.bump { animation: bump .3s ease-out; }
@keyframes bump { 50% { transform: scale(1.18); } }
#chat { pointer-events: auto; display: flex; gap: 6px; width: 100%; max-width: 440px; }
#chat input { flex: 1; min-width: 0; font: 16px var(--font-body); color: var(--ink); padding: 9px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--panel); outline: none; -webkit-user-select: text; user-select: text; }
#chat input:focus { border-color: var(--carrot); }
#chat button, .btn { font-family: var(--font-display); font-size: 16px; border: none; border-radius: 999px; background: var(--carrot); color: #fff; padding: 0 16px; cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 0 #c96a1f; }
#chat button:active, .btn:active { transform: translateY(2px); box-shadow: none; }
#log { display: flex; flex-direction: column; gap: 3px; max-width: min(320px, 100%); font-size: 13px; }
#log div { background: rgba(255, 252, 244, 0.78); padding: 3px 10px; border-radius: 10px; width: fit-content; max-width: 100%; overflow-wrap: anywhere; transition: opacity .6s; }
#log b { font-family: var(--font-display); font-weight: normal; margin-right: 4px; }
#log .me b { color: #c9621a; }

/* controls */
#joy { position: fixed; z-index: 5; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 118px; height: 118px; border-radius: 50%; background: rgba(255, 252, 244, 0.42); border: 2px solid rgba(255, 255, 255, 0.85); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--panel); box-shadow: 0 3px 0 rgba(45, 58, 46, .2); pointer-events: none; }
#actions { position: fixed; z-index: 5; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: grid; grid-template-columns: 58px 58px 58px; grid-template-rows: 58px 58px; gap: 8px; }
.act { width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--panel); color: var(--ink); font-family: var(--font-display); font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; touch-action: manipulation; box-shadow: 0 3px 0 rgba(45, 58, 46, .2); padding: 0; }
.act .ic { font-size: 21px; line-height: 1; }
.act:active { transform: translateY(2px); box-shadow: none; }
#skill { grid-column: 1; grid-row: 2; background: var(--type); color: #fff; font-size: 11px; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); transition: opacity .2s; }
#skill:disabled { opacity: .45; }
#wave { grid-column: 2; grid-row: 1; }
#heart { grid-column: 2; grid-row: 2; }
#jump { grid-column: 3; grid-row: 1 / span 2; width: 58px; height: 124px; border-radius: 29px; background: var(--carrot); color: #fff; box-shadow: 0 3px 0 #c96a1f; font-size: 15px; }
.hint { display: none; position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); font-size: 13px; background: var(--panel); padding: 6px 12px; border-radius: 10px; }
.hint kbd { font-family: var(--font-display); background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
@media (hover: hover) and (pointer: fine) { #joy { display: none; } .hint { display: block; } }
button:focus-visible, input:focus-visible { outline: 3px solid #2d7fd3; outline-offset: 2px; }

/* customise card */
#intro { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); background: rgba(45, 58, 46, .25); }
.card { width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--panel); border-radius: 22px; padding: 18px 18px 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 0 rgba(45, 58, 46, .18); }
.card h1 { margin: 0; font-family: var(--font-display); font-weight: normal; font-size: 30px; line-height: 1.1; text-wrap: balance; }
.card h1 span { color: var(--carrot); }
.card p { margin: 0; font-size: 13.5px; line-height: 1.55; opacity: .85; }
.card label, .card .lbl { font-family: var(--font-display); font-size: 14px; letter-spacing: .02em; }
#pv { width: 100%; height: 150px; display: block; border-radius: 16px; background: linear-gradient(#cfeaf5, #e7f5d9); }
.field { display: flex; flex-direction: column; gap: 6px; }
#nameInput { font: 16px var(--font-body); color: var(--ink); padding: 9px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; -webkit-user-select: text; user-select: text; }
.swatches, .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(45, 58, 46, .25); cursor: pointer; touch-action: manipulation; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--carrot); }
.chip { font-family: var(--font-display); font-size: 14px; color: var(--ink); padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: #fff; cursor: pointer; touch-action: manipulation; }
.chip[aria-pressed="true"] { border-color: var(--carrot); background: #fff1e2; }
#typeDesc { font-size: 13px; background: #fff; border-radius: 12px; padding: 8px 12px; border: 1px dashed var(--line); }
.card-actions { display: flex; gap: 8px; }
.card-actions .btn { flex: 1; height: 46px; font-size: 19px; }
.btn.ghost { flex: 0 0 auto; background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
@media (prefers-reduced-motion: reduce) { .bubble, .float, #carrots.bump { animation: none; } }
</style>

<canvas id="c" aria-label="토끼 마을 3D 화면"></canvas>
<div id="labels"></div>

<div class="hud">
  <div class="hud-row">
    <span class="pill" id="carrots">🥕 <span id="carrotNum">0</span></span>
    <div class="hud-right">
      <button class="pill" id="editBtn" type="button" aria-label="내 토끼 꾸미기" title="내 토끼 꾸미기" hidden>✏️</button>
      <button class="pill" id="timeBtn" type="button" title="시간: 자동 → 낮 고정 → 밤 고정"><span id="timeIc">☀️</span><span id="timeTxt">12:00</span></button>
      <span class="pill" id="onlinePill" title="같은 링크로 들어온 실제 친구 수"><span class="dot off" id="netDot"></span><span id="online">1</span><small>명</small></span>
    </div>
  </div>
  <form id="chat" autocomplete="off">
    <input id="chatInput" maxlength="60" placeholder="이웃 토끼에게 말 걸기" aria-label="채팅 메시지">

  </form>

</div>

<div id="joy" aria-label="이동 조이스틱"><div id="knob"></div></div>
<div id="actions">
  <button class="act" id="skill" type="button"><span class="ic" id="skillIc">🌿</span><span id="skillName">꽃피우기</span></button>

</div>
<div class="hint"><kbd>W A S D</kbd> 이동 · <kbd>Space</kbd> 점프 · <kbd>F</kbd> 기술 · 드래그로 시점 · <kbd>Enter</kbd> 채팅</div>

<div id="intro">
  <form class="card" id="introForm" autocomplete="off">
    <h1 id="introTitle">토끼 마을에 <span>깡총</span> 입장</h1>
    <canvas id="pv" aria-label="내 토끼 미리보기"></canvas>
    <div class="field">
      <label for="nameInput">내 토끼 이름</label>
      <input id="nameInput" maxlength="8" placeholder="예: 말랑이">
    </div>
    <div class="field"><span class="lbl">털 색</span><div class="swatches" id="furSw"></div></div>
    <div class="field"><span class="lbl">무늬</span><div class="chips" id="patChips"></div></div>
    <div class="field" id="pcField"><span class="lbl">무늬 색</span><div class="swatches" id="pcSw"></div></div>
    <div class="field"><span class="lbl">눈 색</span><div class="swatches" id="eyeSw"></div></div>
    <div class="field"><span class="lbl">타입</span><div class="chips" id="typeChips"></div><div id="typeDesc"></div></div>
    <p>같은 링크로 들어온 친구는 파란 이름표로 실시간으로 보여요.</p>
    <div class="card-actions">
      <button class="btn ghost" id="closeIntro" type="button" hidden>닫기</button>
      <button class="btn" id="enter" type="submit">입장하기</button>
    </div>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const hex = c => '#' + c.toString(16).padStart(6, '0');
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ---------- customisation options ---------- */
const PALETTE = [[0xffffff, '하양'], [0xf3e2c7, '크림'], [0xd8b088, '갈색'], [0x9b8576, '회갈색'], [0x5e4b43, '초코'], [0xf3a0c2, '분홍'], [0xa9d8f5, '하늘'], [0xaee8d4, '민트'], [0xae8be6, '보라'], [0x2f2a2a, '검정']];
const PATTERNS = [['plain', '민무늬'], ['dutch', '더치'], ['siamese', '샴'], ['spots', '점박이'], ['mascara', '마스카라']];
const PATTERN_KEYS = PATTERNS.map(p => p[0]);
const EYES = [[0x1f1a18, '검정'], [0x6b3d1f, '갈색'], [0x3b7fd9, '파랑'], [0xc8283a, '빨강']];
const TYPES = {
  grass:  { n: '풀',   ic: '🌿', skill: '꽃피우기', color: '#5fae3e', cd: 3, desc: '기술: 주변에 꽃을 활짝 피워요.' },
  ground: { n: '땅',   ic: '🪨', skill: '굴 파기',  color: '#a87a4a', cd: 5, desc: '기술: 땅속으로 쏙 숨어요. 숨어 있는 동안은 불꽃에도 끄떡없어요.' },
  water:  { n: '물',   ic: '💧', skill: '물장구',   color: '#3d97d6', cd: 2, desc: '연못 위를 건널 수 있어요. 기술: 시원한 물보라.' },
  fire:   { n: '불',   ic: '🔥', skill: '불꽃',     color: '#e8542f', cd: 4, desc: '기술: 앞으로 불을 뿜어요. 맞은 토끼는 기절해서 광장에서 다시 시작해요.' },
  faith:  { n: '신앙', ic: '✝️', skill: '기도',     color: '#d9a514', cd: 3, desc: '기술: 머리 위에 빛나는 십자가가 떠요.' },
};
const TYPE_KEYS = Object.keys(TYPES);

/* ---------- saved profile ---------- */
let save = { name: '', fur: 0, pat: 'plain', pc: 9, eye: 0, type: 'grass', carrots: 0, time: 'auto' };
try { Object.assign(save, JSON.parse(localStorage.getItem('bunny-village') || '{}')); } catch (e) {}
const okIdx = (v, n, d) => (Number.isInteger(v) && v >= 0 && v < n) ? v : d;
save.fur = okIdx(save.fur, PALETTE.length, 0); save.pc = okIdx(save.pc, PALETTE.length, 9); save.eye = okIdx(save.eye, EYES.length, 0);
if (!PATTERN_KEYS.includes(save.pat)) save.pat = 'plain';
if (!TYPES[save.type]) save.type = 'grass';
if (!['auto', 'day', 'night'].includes(save.time)) save.time = 'auto';
const persist = () => { try { localStorage.setItem('bunny-village', JSON.stringify(save)); } catch (e) {} };
const lookOf = o => ({ fur: o.fur, pat: o.pat, pc: o.pc, eye: o.eye });
const lookKey = l => `${l.fur}|${l.pat}|${l.pc}|${l.eye}`;

/* ---------- renderer ---------- */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f2);
scene.fog = new THREE.Fog(0xbfe3f2, 38, 100);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 300);

const hemi = new THREE.HemisphereLight(0xfff6e0, 0x6c9a52, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d4, 0.8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 90 });
scene.add(sun, sun.target);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.92, metalness: 0 }, o));
function mesh(geo, m, x = 0, y = 0, z = 0, shadow = true) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z);
  o.castShadow = shadow; o.receiveShadow = true;
  return o;
}
function disposeObj(o) {
  o.traverse(c => { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261112);

/* ---------- world ---------- */
const obstacles = [];
const WORLD_R = 56;
function free(x, z, pad) {
  if (Math.hypot(x, z) > WORLD_R - 2) return false;
  for (const o of obstacles) if (Math.hypot(x - o.x, z - o.z) < o.r + pad) return false;
  return true;
}

const ground = mesh(new THREE.CircleGeometry(90, 64), mat(0x9ad46f), 0, 0, 0, false);
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const plaza = mesh(new THREE.CircleGeometry(7, 48), mat(0xf0deb0), 0, 0.01, 0, false);
plaza.rotation.x = -Math.PI / 2; scene.add(plaza);
const plazaRing = mesh(new THREE.RingGeometry(7, 7.5, 48), mat(0xd9c38d), 0, 0.012, 0, false);
plazaRing.rotation.x = -Math.PI / 2; scene.add(plazaRing);

for (let i = 0; i < 20; i++) {
  const a = i / 20 * TAU + R() * 0.2, r = 66 + R() * 10, s = 9 + R() * 9;
  const h = mesh(new THREE.SphereGeometry(s, 12, 8), mat(i % 2 ? 0x86c45e : 0x7ab655, { flatShading: true }), Math.cos(a) * r, -1.5, Math.sin(a) * r, false);
  h.scale.y = 0.45 + R() * 0.4; scene.add(h);
}

// giant carrot statue in the plaza
{
  const g = new THREE.Group();
  const body = mesh(new THREE.ConeGeometry(0.95, 3.4, 10), mat(0xf28c38, { flatShading: true }), 0, 1.9, 0);
  body.rotation.x = Math.PI; g.add(body);
  for (let i = 0; i < 4; i++) {
    const leaf = mesh(new THREE.ConeGeometry(0.22, 1.3, 6), mat(0x5f9e4b, { flatShading: true }), 0, 4.1, 0);
    leaf.rotation.z = (i - 1.5) * 0.35; leaf.rotation.x = (i % 2 ? 0.25 : -0.25); g.add(leaf);
  }
  g.add(mesh(new THREE.CylinderGeometry(1.5, 1.7, 0.35, 16), mat(0xcbb98f), 0, 0.17, 0));
  scene.add(g);
  obstacles.push({ x: 0, z: 0, r: 1.6 });
}

// pond
const POND = { x: 17, z: -13, r: 6.5 };
{
  const water = mesh(new THREE.CircleGeometry(POND.r, 40), mat(0x7cc6e8, { roughness: 0.3 }), POND.x, 0.03, POND.z, false);
  water.rotation.x = -Math.PI / 2; scene.add(water);
  const stoneGeo = new THREE.DodecahedronGeometry(0.45, 0);
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * TAU;
    const s = mesh(stoneGeo, mat(0xb8b4a8, { flatShading: true }), POND.x + Math.cos(a) * (POND.r + 0.2), 0.12, POND.z + Math.sin(a) * (POND.r + 0.2));
    s.scale.setScalar(0.6 + R() * 0.6); s.rotation.set(R() * 3, R() * 3, 0); scene.add(s);

const DAY_MS = 8 * 60 * 1000; // one village day = 8 real minutes, same for everyone
const SKY = { day: new THREE.Color(0xbfe3f2), dusk: new THREE.Color(0xf2b28a), night: new THREE.Color(0x141c3a) };

const tmpC = new THREE.Color(), sunDir = new THREE.Vector3();
let nightAmt = 0, lastClock = '';
function clockPhase() {

}

  sun.color.copy(SUNC.night).lerp(SUNC.day, day);
  cloudMat.color.setHex(0x5a6383).lerp(tmpC.setHex(0xffffff), day);
  sunDir.set(-Math.sin(a), elev, 0.35).normalize();
  sunDisc.position.copy(camera.position).addScaledVector(sunDir, 160); sunDisc.visible = elev > -0.15;
  moonDisc.position.copy(camera.position).addScaledVector(sunDir, -160); moonDisc.visible = elev < 0.15;
  const lightDir = elev >= 0 ? sunDir : tmpV.copy(sunDir).negate();
  sun.position.set(focus.x + lightDir.x * 40, Math.max(12, lightDir.y * 40), focus.z + lightDir.z * 40 + 8);
  sun.target.position.copy(focus);
  stars.position.copy(camera.position); stars.material.opacity = smooth(0.35, 0.9, nightAmt);
  flies.material.opacity = smooth(0.4, 0.95, nightAmt) * 0.95;
  for (const m of windowMats) m.emissiveIntensity = 0.2 + nightAmt * 1.6;
  for (const l of houseLights) l.intensity = nightAmt * 1.4;
  // clock + icon
  const mins = Math.floor(ph * 24 * 60), hh = Math.floor(mins / 60), mm = mins % 60;
  const ic = nightAmt > 0.5 ? '🌙' : (dusk > 0.5 ? '🌇' : '☀️');
  const txt = save.time === 'auto' ? `${String(hh).padStart(2, '0')}:${String(mm - mm % 10).padStart(2, '0')}` : (save.time === 'day' ? '낮 고정' : '밤 고정');
  if (ic + txt !== lastClock) { lastClock = ic + txt; $('#timeIc').textContent = ic; $('#timeTxt').textContent = txt; }
}

// spots / mascara are painted onto the fur as a texture (sphere UV: u = around, v = top→bottom)
const patTexCache = new Map();
function patternTex(kind, part, furC, patC) {
  const key = `${kind}|${part}|${furC}|${patC}`;
  if (patTexCache.has(key)) return patTexCache.get(key);
  const W = 512, H = 256, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); g.fillStyle = hex(furC); g.fillRect(0, 0, W, H);
  const pc = hex(patC);
  const blob = (u, v, r) => {
    const sx = 1 / Math.max(0.2, Math.sin(v * Math.PI)); // undo sphere stretching near the poles
    for (const du of [-1, 0, 1]) {
      g.save(); g.translate((u + du) * W, v * H); g.scale(sx, 1);
      const grd = g.createRadialGradient(0, 0, r * 0.6, 0, 0, r);
      grd.addColorStop(0, pc); grd.addColorStop(1, pc + '00');
      g.fillStyle = grd; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); g.restore();
    }
  };
  const rr = rng(part === 'body' ? 4242 : 777);
  const patch = (u, v, r) => { blob(u, v, r); for (let i = 0; i < 3; i++) blob(u + (rr() - 0.5) * r * 1.1 / W, v + (rr() - 0.5) * r * 1.1 / H, r * (0.55 + rr() * 0.3)); };
  if (kind === 'spots') {
    if (part === 'body') for (let i = 0; i < 16; i++) patch(rr(), 0.2 + rr() * 0.58, 14 + rr() * 16);
    else for (const [u, v, r] of [[0.4, 0.22, 18], [0.62, 0.3, 20], [0.9, 0.42, 16], [0.08, 0.2, 14]]) patch(u, v, r);
  } else if (kind === 'mascara') {
    if (part === 'body') {
      for (let v = 0.01; v < 0.36; v += 0.008) blob(0.25, v, 11);
      for (let v = 0.01; v < 0.5; v += 0.008) blob(0.75, v, 12 - v * 8);
    } else {
      for (const u of [0.184, 0.316]) { blob(u, 0.448, 21); blob(u, 0.448, 17); } // eye rings
      for (let v = 0.01; v < 0.43; v += 0.006) blob(0.25, v, 7 + v * 10); // stripe down the nose bridge
    }
  }
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  patTexCache.set(key, t);
  return t;
}
const HEAD = [0, 1.17, 0.32];
function makeBunny(look, parent = scene) {
  const root = new THREE.Group(), inner = new THREE.Group(); root.add(inner);
  const furC = (PALETTE[look.fur] || PALETTE[0])[0], patC = (PALETTE[look.pc] || PALETTE[9])[0];
  const fur = mat(furC), patM = mat(patC), white = mat(0xffffff), pink = mat(0xf4a7b9);
  const eyeM = mat((EYES[look.eye] || EYES[0])[0], { roughness: 0.35 });
  const p = look.pat;
  const earM = (p === 'dutch' || p === 'siamese') ? patM : fur;
  const footM = p === 'siamese' ? patM : fur;
  const painted = p === 'spots' || p === 'mascara';
  const bodyM = painted ? mat(0xffffff, { map: patternTex(p, 'body', furC, patC) }) : fur;
  const headM = painted ? mat(0xffffff, { map: patternTex(p, 'head', furC, patC) }) : fur;

  const body = mesh(new THREE.SphereGeometry(0.55, 32, 24), bodyM, 0, 0.58, 0); body.scale.set(1, 0.92, 1.1); inner.add(body);
  const belly = mesh(new THREE.SphereGeometry(0.38, 14, 10), white, 0, 0.55, 0.3, false); belly.scale.set(1, 1, 0.6); inner.add(belly);
  inner.add(mesh(new THREE.SphereGeometry(0.43, 32, 24), headM, ...HEAD));
  const headPatch = (phiS, phiL, thS, thL) => inner.add(mesh(new THREE.SphereGeometry(0.437, 20, 16, phiS, phiL, thS, thL), patM, ...HEAD, false));

  if (p === 'dutch') {
    // coloured rear half + coloured head with a white blaze down the middle
    const rear = mesh(new THREE.SphereGeometry(0.562, 18, 14, Math.PI, Math.PI), patM, 0, 0.58, 0); rear.scale.copy(body.scale); inner.add(rear);
    headPatch(Math.PI / 2 + 0.34, TAU - 0.68, 0, Math.PI);
  } else if (p === 'siamese') {
    headPatch(Math.PI / 2 - 0.78, 1.56, Math.PI * 0.36, Math.PI * 0.5);
  }

  const ears = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s * 0.17, 1.5, 0.24); pivot.rotation.z = -s * 0.14;
    const ear = mesh(new THREE.SphereGeometry(0.13, 12, 10), earM, 0, 0.32, 0); ear.scale.set(1, 3, 0.6);
    const innerEar = mesh(new THREE.SphereGeometry(0.08, 10, 8), pink, 0, 0.32, 0.05, false); innerEar.scale.set(1, 3.6, 0.4);
    pivot.add(ear, innerEar); inner.add(pivot); ears.push(pivot);
  }
  for (const s of [-1, 1]) {
    inner.add(mesh(new THREE.SphereGeometry(0.064, 12, 10), eyeM, s * 0.17, 1.24, 0.69, false));
    inner.add(mesh(new THREE.SphereGeometry(0.02, 6, 4), white, s * 0.17 + 0.02, 1.27, 0.748, false));
    const cheek = mesh(new THREE.SphereGeometry(0.07, 8, 6), pink, s * 0.27, 1.08, 0.64, false); cheek.scale.z = 0.4; inner.add(cheek);
  }
  inner.add(mesh(new THREE.SphereGeometry(0.055, 8, 6), pink, 0, 1.12, 0.765, false));
  inner.add(mesh(new THREE.SphereGeometry(0.19, 10, 8), white, 0, 0.55, -0.62));
  for (const s of [-1, 1]) {
    const f = mesh(new THREE.SphereGeometry(0.17, 10, 8), footM, s * 0.27, 0.1, 0.18); f.scale.set(0.9, 0.55, 1.6); inner.add(f);
  }
  parent.add(root);
  return { root, inner, ears };
}

const fx = [];
const fxGeo = new THREE.SphereGeometry(1, 8, 6);
function spawnFx(kind, x, y, z, v, life, color, size) {
  const m = new THREE.Mesh(fxGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
  m.position.set(x, y, z); m.scale.setScalar(size); scene.add(m);
  fx.push({ m, v, life, max: life, kind, size });
}
function spawnObj(kind, obj, life, size = 1) { scene.add(obj); obj.scale.setScalar(0.001); fx.push({ m: obj, v: null, life, max: life, kind, size }); }
function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.life -= dt;
    if (f.life <= 0) { scene.remove(f.m); if (f.m.material && f.m.geometry === fxGeo) f.m.material.dispose(); else if (f.kind !== 'fire' && f.kind !== 'drop') disposeObj(f.m); fx.splice(i, 1); continue; }
    const k = 1 - f.life / f.max;
    if (f.kind === 'fire') {
      f.m.position.addScaledVector(f.v, dt); f.m.scale.setScalar(f.size * (1 + k * 2)); f.m.material.opacity = 1 - k;
    } else if (f.kind === 'drop') {
      f.v.y -= 14 * dt; f.m.position.addScaledVector(f.v, dt); f.m.material.opacity = 1 - k * 0.6;
      if (f.m.position.y < 0.02) f.life = 0.001;
    } else { // grow, hold, shrink
      const grow = Math.min(1, (f.max - f.life) / 0.4), shrink = Math.min(1, f.life / 0.8);
      f.m.scale.setScalar(f.size * Math.max(0.001, Math.min(grow, shrink)));
      if (f.kind === 'mound') f.m.scale.y *= 0.35;
    }
  }
}

/* ---------- simulation ---------- */
function collide(p, canSwim) {

    if (o.pond && canSwim) continue;
    const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + 0.45;
    if (d < m && d > 1e-4) { p.x = o.x + dx / d * m; p.z = o.z + dz / d * m; }

function physics(e, dt) {

  animate(e, dt);
}

  e.ears[0].rotation.x = e.ears[1].rotation.x = -Math.sin(e.hop) * 0.25 + (e.onGround ? 0 : -0.4);
  if (e.wave > 0) { e.wave -= dt; const w = Math.sin(e.wave * 14) * 0.45; e.ears[0].rotation.z = 0.14 + w; e.ears[1].rotation.z = -0.14 - w; }

    for (let i = 0; i < 3; i++) {
      const sp = 7 + Math.random() * 2;
      spawnFx('fire', e.pos.x + fx_ * 0.85, e.pos.y + e.inner.position.y + 1.12, e.pos.z + fz * 0.85,
        new THREE.Vector3(fx_ * sp + (Math.random() - .5) * 2, 0.6 + (Math.random() - .5) * 1.2, fz * sp + (Math.random() - .5) * 2),
        0.5, pick([0xff6a2a, 0xffa22e, 0xffe066]), 0.12);
    }
  }
  // faith cross
  if (e.cross > 0) {
    e.cross -= dt;
    if (!e.crossMesh) { e.crossMesh = makeCross(); e.root.add(e.crossMesh); }
    e.crossMesh.visible = true;
    e.crossMesh.position.y = 2.45 + e.inner.position.y + Math.sin(performance.now() / 300) * 0.08;
    e.crossMesh.rotation.y = -e.rot + cam.yaw; // face the camera
    e.crossMesh.scale.setScalar(Math.min(1, (5 - e.cross) * 4, e.cross * 2));
  } else if (e.crossMesh) e.crossMesh.visible = false;
  e.lift += ((e.cross > 0 ? 0.95 : 0) - e.lift) * Math.min(1, dt * 8);
}

function updatePlayer(dt) {
  if (player.skillCd > 0 && (player.skillCd -= dt) <= 0) $('#skill').disabled = false;
  if (player.ko > 0) {
    player.moving = false;
    if ((player.ko -= dt) <= 0) respawn(player);
  } else if (player.dig > 0) {
    player.moving = false;
  } else {
    let ix = joy.x + (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let iy = joy.y + (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
    const l = Math.hypot(ix, iy); if (l > 1) { ix /= l; iy /= l; }
    const sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw);
    const mx = -sy * iy + cy * ix, mz = -cy * iy - sy * ix, m = Math.hypot(mx, mz);
    player.moving = m > 0.08;
    if (player.moving) {
      const sp = 5.5 * Math.min(1, m);
      player.pos.x += mx / m * sp * dt; player.pos.z += mz / m * sp * dt;
      player.rot = turnTo(player.rot, Math.atan2(mx, mz), dt * 12);
    }
  }
  collide(player.pos, player.type === 'water');
  physics(player, dt);
  // water type walking on the pond leaves ripples
  if (player.type === 'water' && player.moving && Math.hypot(player.pos.x - POND.x, player.pos.z - POND.z) < POND.r && Math.random() < dt * 12)
    spawnFx('drop', player.pos.x, 0.1, player.pos.z, new THREE.Vector3((Math.random() - .5) * 2, 2.5, (Math.random() - .5) * 2), 0.6, 0xbfe9fb, 0.07);

  for (const n of npcs) {
    const d = n.pos.distanceTo(player.pos);
    if (!n.greeted && d < 4 && !(n.ko > 0)) { n.greeted = true; if (n !== npcs[0] || Math.random() < 0.5) say(n, pick([`${player.name} 안녕!`, '처음 보는 토끼네? 반가워!', `안녕~ 나는 ${TYPES[n.type].n} 타입 ${n.name}!`])); }
  }
  for (const c of carrots) {
    if (c.respawn > 0 || player.ko > 0 || player.dig > 0) continue;
    if (Math.hypot(c.g.position.x - player.pos.x, c.g.position.z - player.pos.z) < 1.2 && player.pos.y < 1.5) {
      c.respawn = 4 + Math.random() * 4; c.g.visible = false;
      save.carrots = (save.carrots || 0) + 1; persist();
      $('#carrotNum').textContent = save.carrots;
      const el = $('#carrots'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
      floatUp(player, '🥕', 1);
      if (save.carrots % 10 === 0) { const n = nearestNpc(20); if (n) say(n, `우와! 당근 ${save.carrots}개라니, 당근 부자다!`); }
    }
  }
}

function updateNpc(n, dt) {
  if (n.ko > 0) {
    n.moving = false;
    if ((n.ko -= dt) <= 0) respawn(n);
    physics(n, dt); return;
  }
  if (n.dig > 0) { n.moving = false; physics(n, dt); return; }
  if (!n.target || n.idle > 0) {
    n.moving = false;
    if ((n.idle -= dt) <= 0) {
      let x, z;
      if (player && Math.random() < 0.25) { x = player.pos.x + (Math.random() - .5) * 5; z = player.pos.z + (Math.random() - .5) * 5; }
      else [x, z] = randomSpot(1.2);
      n.target = new THREE.Vector3(x, 0, z); n.idle = 0; n.stuck = 0;
    }
  } else {
    const dx = n.target.x - n.pos.x, dz = n.target.z - n.pos.z, d = Math.hypot(dx, dz);
    if (d < 0.6 || n.stuck > 2.5) { n.target = null; n.idle = 1 + Math.random() * 4; n.moving = false; }
    else {
      n.moving = true;
      const px = n.pos.x, pz = n.pos.z;
      n.pos.x += dx / d * 2.4 * dt; n.pos.z += dz / d * 2.4 * dt;
      n.rot = turnTo(n.rot, Math.atan2(dx, dz), dt * 8);
      collide(n.pos, n.type === 'water');
      n.stuck = Math.hypot(n.pos.x - px, n.pos.z - pz) < 2.4 * dt * 0.3 ? n.stuck + dt : 0;
    }
  }
  if ((n.chatT -= dt) <= 0) {
    n.chatT = 9 + Math.random() * 14;
    const near = !player || n.pos.distanceTo(player.pos) < 22;
    if (near) {
      const r = Math.random();
      if (r < 0.6) say(n, pick(nightAmt > 0.5 && Math.random() < 0.6 ? NIGHT_LINES : LINES));
      else if (r < 0.75) wave(n);
      else if (r < 0.85) heart(n);
      else doSkill(n);
    }
  }
  if (Math.random() < dt * 0.06) jump(n);
  physics(n, dt);
}

/* ---------- labels ---------- */
const v3 = new THREE.Vector3();
let W = 1, H = 1;
function placeLabel(e) {
  v3.copy(e.pos); v3.y += 2.25 + e.inner.position.y * (e.dig > 0 ? 0.6 : 1) + e.lift;
  const far = camera.position.distanceTo(v3) > 38;
  v3.project(camera);
  if (far || v3.z > 1) { e.tag.style.visibility = 'hidden'; return; }
  e.tag.style.visibility = '';
  e.tag.style.transform = `translate(${(v3.x * 0.5 + 0.5) * W}px, ${(-v3.y * 0.5 + 0.5) * H}px) translate(-50%, -100%)`;
}

function resize() {
  W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.fov = W < H ? 62 : 55; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- loop ---------- */
let last = performance.now(), t = 0;
const flyPos = flies.geometry.attributes.position, flyBase = flies.userData.base;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (player) { updatePlayer(dt); sendPresence(now); } else cam.yaw += dt * 0.08;
  for (const n of npcs) updateNpc(n, dt);
  updateRemotes(dt);
  updateFx(dt);
  for (const c of carrots) {
    if (c.respawn > 0 && (c.respawn -= dt) <= 0) { const [x, z] = randomSpot(1); c.g.position.set(x, 0.7, z); c.g.visible = true; }
    c.g.rotation.y += dt * 1.8; c.g.position.y = 0.7 + Math.sin(t * 2.5 + c.phase) * 0.15;
  }
  for (const cl of clouds) { cl.position.x += dt * 0.6; if (cl.position.x > 60) cl.position.x = -60; }
  if (nightAmt > 0.3) {
    for (let i = 0; i < flyBase.length; i++) {
      const b = flyBase[i];
      flyPos.setXYZ(i, b[0] + Math.sin(t * 0.7 + b[3]) * 1.2, b[1] + Math.sin(t * 1.3 + b[3] * 2) * 0.4, b[2] + Math.cos(t * 0.6 + b[3]) * 1.2);
    }
    flyPos.needsUpdate = true;
  }

  const focus = player ? player.pos : null;
  if (focus) cam.target.lerp(v3.set(focus.x, Math.max(0, focus.y) * 0.5 + 1, focus.z), Math.min(1, dt * 8));
  else cam.target.set(0, 1.5, 0);
  const dist = player ? cam.dist : 22, pitch = player ? cam.pitch : 0.35;
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * Math.cos(pitch) * dist,
    cam.target.y + Math.sin(pitch) * dist,
    cam.target.z + Math.cos(cam.yaw) * Math.cos(pitch) * dist);
  camera.lookAt(cam.target);
  updateSky(cam.target);

  renderer.render(scene, camera);
  for (const n of npcs) placeLabel(n);
  for (const e of remotes.values()) placeLabel(e);
  if (player) placeLabel(player);

  if (pr && !$('#intro').hidden && pb) {
    const w = pv.clientWidth, h = pv.clientHeight;
    if (w && (pv.width !== Math.round(w * pr.getPixelRatio()) || pv.height !== Math.round(h * pr.getPixelRatio()))) { pr.setSize(w, h, false); pcam.aspect = w / h; pcam.updateProjectionMatrix(); }
    pb.root.rotation.y += dt * 0.9;
    pr.render(pscene, pcam);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
